<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <title>Vcode Service</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png"
          href="https://lh3.googleusercontent.com/d/1Bh0sQ7LYGPl_IwsisMQtHz3H45vYcefx">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .sig-canvas {
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            width: 100%;
            height: 140px;
            background-color: #ffffff;
            cursor: crosshair;
            display: block;
        }

        .copy-success {
            animation: copyPulse 0.3s ease-in-out;
        }

        @keyframes copyPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
    </style>
</head>

<body class="bg-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">

    <!-- HEADER -->
    <div class="bg-slate-900 px-6 py-6 text-center border-b-4 border-red-600 relative">

        <!-- Install App -->
        <div id="installBanner"
             class="mb-4 bg-red-600/20 border border-red-500 rounded-xl p-2.5 flex items-center justify-between">

            <span class="text-xs text-white font-medium flex items-center gap-2">
                <i class="fas fa-mobile-screen-button text-red-400"></i>
                Install App on Device
            </span>

            <button type="button"
                    id="installBtn"
                    class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow transition cursor-pointer">
                Install App
            </button>
        </div>

        <div class="flex flex-col items-center justify-center space-y-2">

            <!-- Logo -->
            <div class="bg-white px-4 py-2 rounded-xl shadow-md inline-flex items-center justify-center">
                <img src="https://lh3.googleusercontent.com/d/1Bh0sQ7LYGPl_IwsisMQtHz3H45vYcefx"
                     alt="Vcode Logo"
                     class="h-14 sm:h-16 object-contain">
            </div>

            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-wide">
                    SERVICE VISIT REPORT
                </h1>

                <p id="headerSubtitle"
                   class="text-xs sm:text-sm text-red-400 font-medium tracking-wider uppercase mt-0.5">
                    Vcode Inkjet Solutions Pvt Ltd
                </p>
            </div>
        </div>
    </div>


    <!-- FORM -->
    <form id="serviceReportForm" class="p-6 sm:p-8 space-y-6">

        <!-- Visit & Engineer -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Visit Date
                </label>

                <input type="date"
                       id="visitDate"
                       required
                       class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium">
            </div>


            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Engineer Name
                </label>

                <input type="text"
                       id="engineerName"
                       placeholder="Enter your name"
                       required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>


            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Region
                </label>

                <select id="region"
                        required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">

                    <option value="">Select Region</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</option>
                    <option value="Telangana">Telangana</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Orissa">Orissa</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Other">Other</option>

                </select>
            </div>

        </div>


        <!-- Customer -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Customer Name / Company
                </label>

                <input type="text"
                       id="customerName"
                       placeholder="e.g. Sri Venkateswara Industries"
                       required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>


            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Customer Address / Location
                </label>

                <input type="text"
                       id="address"
                       placeholder="e.g. Industrial Estate, Vijayawada"
                       required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>

        </div>


        <!-- Machine -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Printer Brand / Model
                </label>

                <input type="text"
                       id="printerBrand"
                       placeholder="e.g. Vcode CIJ"
                       required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>


            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Serial Number
                </label>

                <input type="text"
                       id="serialNumber"
                       placeholder="e.g. VC-2026-908"
                       required
                       class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
            </div>


            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Warranty Status
                </label>

                <select id="warrantyStatus"
                        required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">

                    <option value="">Select Status</option>
                    <option value="Under Warranty">Under Warranty</option>
                    <option value="Out of Warranty">Out of Warranty</option>
                    <option value="AMC Contract">AMC Contract</option>

                </select>
            </div>

        </div>


        <!-- Service -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Service Type
                </label>

                <select id="serviceType"
                        required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">

                    <option value="">Select Type</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Repair">Repair</option>
                    <option value="Breakdown">Breakdown</option>
                    <option value="General Visit">General Visit</option>
                    <option value="Installation">Installation</option>

                </select>
            </div>


            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Service Status
                </label>

                <select id="serviceStatus"
                        required
                        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white font-semibold">

                    <option value="🟢 Completed">🟢 Completed</option>
                    <option value="🟡 Pending">🟡 Pending</option>

                </select>
            </div>

        </div>


        <!-- Work -->
        <div class="space-y-4 pt-2">

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                    Work Done / Observations
                </label>

                <textarea id="workDone"
                          rows="3"
                          placeholder="Describe issue found & corrective action..."
                          required
                          class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
            </div>


            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                        Parts Replaced (Optional)
                    </label>

                    <input type="text"
                           id="partsReplaced"
                           placeholder="e.g. Filter, Nozzle"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>


                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                        Next Follow-up Date (Optional)
                    </label>

                    <input type="date"
                           id="followUpDate"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>

            </div>

        </div>


        <!-- Consumables -->
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">

            <div class="flex items-center justify-between">

                <label class="text-xs font-bold text-slate-700 uppercase">
                    Consumables Stock Requirement (Optional)
                </label>

                <input type="checkbox"
                       id="consumablesToggle"
                       onchange="toggleConsumablesBox()"
                       class="w-4 h-4 text-red-600 rounded focus:ring-red-500">

            </div>


            <div id="consumablesFields"
                 class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2 hidden">

                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">
                        Ink Quantity (Nos)
                    </label>

                    <input type="number"
                           id="inkQty"
                           value="0"
                           min="0"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                </div>


                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">
                        Makeup Quantity (Nos)
                    </label>

                    <input type="number"
                           id="makeupQty"
                           value="0"
                           min="0"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                </div>


                <div>
                    <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">
                        Wash Quantity (Nos)
                    </label>

                    <input type="number"
                           id="washQty"
                           value="0"
                           min="0"
                           class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                </div>

            </div>
        </div>


        <!-- Signatures -->
        <div class="pt-4 border-t border-slate-200 grid grid-cols-1 sm:grid-cols-2 gap-6">

            <!-- Engineer -->
            <div class="space-y-2">

                <label class="block text-xs font-bold text-slate-700 uppercase">
                    Engineer Signature
                </label>

                <div class="flex justify-between items-center">

                    <span class="text-[11px] text-slate-500">
                        Sign below
                    </span>

                    <button type="button"
                            onclick="clearPad('engineer')"
                            class="text-xs text-red-600 underline">
                        Clear
                    </button>

                </div>

                <div class="border-2 border-dashed border-slate-300 rounded-xl overflow-hidden bg-white">

                    <canvas id="engineerCanvas"
                            class="sig-canvas"></canvas>

                </div>

            </div>


            <!-- Customer -->
            <div class="space-y-2">

                <label class="block text-xs font-bold text-slate-700 uppercase">
                    Customer Signatory Name & Signature
                </label>

                <input type="text"
                       id="signerName"
                       placeholder="Signer Name"
                       required
                       class="w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs mb-1">

                <div class="flex justify-between items-center">

                    <span class="text-[11px] text-slate-500">
                        Sign below
                    </span>

                    <button type="button"
                            onclick="clearPad('customer')"
                            class="text-xs text-red-600 underline">
                        Clear
                    </button>

                </div>

                <div class="border-2 border-dashed border-slate-300 rounded-xl overflow-hidden bg-white">

                    <canvas id="customerCanvas"
                            class="sig-canvas"></canvas>

                </div>

            </div>

        </div>


        <!-- ACTION BUTTONS -->
        <div class="pt-4 grid grid-cols-1 sm:grid-cols-2 gap-3">

            <button type="button"
                    onclick="sendToWhatsApp()"
                    class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg flex items-center justify-center gap-2">

                <i class="fab fa-whatsapp text-xl"></i>

                <span>
                    Send to WhatsApp
                </span>

            </button>


            <button type="button"
                    id="copyBtn"
                    onclick="copyMessage()"
                    class="bg-slate-700 hover:bg-slate-800 text-white font-bold py-3 px-6 rounded-xl shadow-lg flex items-center justify-center gap-2">

                <i class="fas fa-copy text-lg"></i>

                <span id="copyBtnText">
                    Copy Message
                </span>

            </button>

        </div>


        <!-- Status -->
        <div id="statusMessage"
             class="hidden text-center text-sm font-semibold rounded-xl p-3">
        </div>

    </form>
</div>


<script>

    /*
     * ==========================================================
     * GOOGLE APPS SCRIPT CONFIGURATION
     * ==========================================================
     *
     * IMPORTANT:
     * This URL is ONLY used to read CONFIGURATION.
     *
     * Service reports are NOT saved to Google Sheet.
     */

    const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbwSyVa_a-NvOdZAiFknXUEMk2v5Y7ca4Ke0czJrEzWBha56j3-_Tm-BMV1Rboo5MZfY4g/exec";


    /*
     * DEFAULT CONFIGURATION
     *
     * If Google Sheet cannot be reached,
     * these values will be used.
     */

    let CONFIG = {

        companyName: "Vcode Inkjet Solutions Pvt Ltd",

        whatsappNumber: "918985361991",

        appName: "Vcode Service",

        appVersion: "1",

        headerSubtitle: "Vcode Inkjet Solutions Pvt Ltd"

    };


    /*
     * ==========================================================
     * PWA INSTALL
     * ==========================================================
     */

    let deferredPrompt = null;


    window.addEventListener('beforeinstallprompt', function (e) {

        e.preventDefault();

        deferredPrompt = e;

        const banner = document.getElementById('installBanner');

        if (banner) {
            banner.style.display = 'flex';
        }

    });


    document.getElementById('installBtn').addEventListener('click', async function () {

        if (deferredPrompt) {

            deferredPrompt.prompt();

            const result = await deferredPrompt.userChoice;

            if (result.outcome === 'accepted') {

                document.getElementById('installBanner').style.display = 'none';

            }

            deferredPrompt = null;

        } else {

            alert(
                "To install this app on your device:\n\n" +

                "Android (Chrome):\n" +
                "Tap the 3-dots menu → Install app / Add to Home screen\n\n" +

                "iPhone (Safari):\n" +
                "Tap Share → Add to Home Screen\n\n" +

                "PC (Chrome / Edge):\n" +
                "Click the Install icon in the browser address bar."
            );

        }

    });


    /*
     * ==========================================================
     * LOAD CONFIGURATION FROM GOOGLE SHEET
     * ==========================================================
     */

    async function loadConfiguration() {

        if (!SCRIPT_URL) {
            return;
        }

        try {

            const response = await fetch(
                SCRIPT_URL,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error("Configuration request failed");
            }

            const remoteConfig = await response.json();


            if (remoteConfig.company_name) {

                CONFIG.companyName =
                    remoteConfig.company_name;

            }


            if (remoteConfig.whatsapp_number) {

                CONFIG.whatsappNumber =
                    remoteConfig.whatsapp_number;

            }


            if (remoteConfig.app_name) {

                CONFIG.appName =
                    remoteConfig.app_name;

            }


            if (remoteConfig.app_version) {

                CONFIG.appVersion =
                    remoteConfig.app_version;

            }


            if (remoteConfig.header_subtitle) {

                CONFIG.headerSubtitle =
                    remoteConfig.header_subtitle;

            }


            console.log("CONFIG loaded successfully");


        } catch (error) {

            console.log(
                "Using default configuration:",
                error
            );

        }


        updateHeader();

    }


    /*
     * ==========================================================
     * UPDATE HEADER
     * ==========================================================
     */

    function updateHeader() {

        const subtitle =
            document.getElementById('headerSubtitle');

        if (subtitle) {

            subtitle.innerText =
                CONFIG.headerSubtitle ||
                CONFIG.companyName;

        }

        document.title =
            CONFIG.appName ||
            "Vcode Service";

    }


    /*
     * ==========================================================
     * PAGE LOAD
     * ==========================================================
     */

    window.addEventListener('DOMContentLoaded', async function () {

        /*
         * Today's date
         */

        const today =
            new Date().toISOString().split('T')[0];

        document.getElementById('visitDate').value =
            today;


        /*
         * Load CONFIG
         */

        await loadConfiguration();


        /*
         * Signature pads
         */

        initCanvas('engineerCanvas');

        initCanvas('customerCanvas');


        /*
         * Service Worker
         */

        if ('serviceWorker' in navigator) {

            navigator.serviceWorker
                .register('./sw.js')
                .then(function () {

                    console.log(
                        "Service Worker registered"
                    );

                })
                .catch(function (error) {

                    console.log(
                        "Service Worker registration failed",
                        error
                    );

                });

        }

    });


    /*
     * ==========================================================
     * CONSUMABLES
     * ==========================================================
     */

    function toggleConsumablesBox() {

        const checked =
            document.getElementById(
                'consumablesToggle'
            ).checked;

        const fields =
            document.getElementById(
                'consumablesFields'
            );


        if (checked) {

            fields.classList.remove('hidden');

        } else {

            fields.classList.add('hidden');

        }

    }


    /*
     * ==========================================================
     * SIGNATURE PAD
     * ==========================================================
     */

    function initCanvas(canvasId) {

        const canvas =
            document.getElementById(canvasId);

        if (!canvas) {
            return;
        }

        const parent =
            canvas.parentElement;


        canvas.width =
            parent.clientWidth;

        canvas.height = 140;


        const ctx =
            canvas.getContext('2d');


        let isDrawing = false;

        let lastX = 0;

        let lastY = 0;


        ctx.strokeStyle = '#0f172a';

        ctx.lineWidth = 2.5;

        ctx.lineCap = 'round';

        ctx.lineJoin = 'round';


        function getCoordinates(e) {

            const rect =
                canvas.getBoundingClientRect();


            const clientX =
                e.clientX ||
                (
                    e.touches &&
                    e.touches[0]
                        ? e.touches[0].clientX
                        : 0
                );


            const clientY =
                e.clientY ||
                (
                    e.touches &&
                    e.touches[0]
                        ? e.touches[0].clientY
                        : 0
                );


            return {

                x:
                    (clientX - rect.left) *
                    (canvas.width / rect.width),

                y:
                    (clientY - rect.top) *
                    (canvas.height / rect.height)

            };

        }


        /*
         * Mouse
         */

        canvas.addEventListener(
            'mousedown',
            function (e) {

                isDrawing = true;

                const pos =
                    getCoordinates(e);

                lastX = pos.x;

                lastY = pos.y;

            }
        );


        canvas.addEventListener(
            'mousemove',
            function (e) {

                if (!isDrawing) {
                    return;
                }

                const pos =
                    getCoordinates(e);


                ctx.beginPath();

                ctx.moveTo(
                    lastX,
                    lastY
                );

                ctx.lineTo(
                    pos.x,
                    pos.y
                );

                ctx.stroke();


                lastX = pos.x;

                lastY = pos.y;

            }
        );


        window.addEventListener(
            'mouseup',
            function () {

                isDrawing = false;

            }
        );


        /*
         * Touch
         */

        canvas.addEventListener(
            'touchstart',
            function (e) {

                e.preventDefault();

                isDrawing = true;

                const pos =
                    getCoordinates(
                        e.touches[0]
                    );

                lastX = pos.x;

                lastY = pos.y;

            },
            {
                passive: false
            }
        );


        canvas.addEventListener(
            'touchmove',
            function (e) {

                if (!isDrawing) {
                    return;
                }

                e.preventDefault();

                const pos =
                    getCoordinates(
                        e.touches[0]
                    );


                ctx.beginPath();

                ctx.moveTo(
                    lastX,
                    lastY
                );

                ctx.lineTo(
                    pos.x,
                    pos.y
                );

                ctx.stroke();


                lastX = pos.x;

                lastY = pos.y;

            },
            {
                passive: false
            }
        );


        canvas.addEventListener(
            'touchend',
            function () {

                isDrawing = false;

            }
        );

    }


    /*
     * ==========================================================
     * CLEAR SIGNATURE
     * ==========================================================
     */

    function clearPad(canvasIdPrefix) {

        const canvas =
            document.getElementById(
                canvasIdPrefix + 'Canvas'
            );

        if (!canvas) {
            return;
        }

        const ctx =
            canvas.getContext('2d');

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }


    /*
     * ==========================================================
     * CREATE SERVICE REPORT MESSAGE
     * ==========================================================
     */

    function createReportMessage() {

        const form =
            document.getElementById(
                'serviceReportForm'
            );


        /*
         * Validate form
         */

        if (!form.checkValidity()) {

            form.reportValidity();

            return null;

        }


        /*
         * Consumables
         */

        let consumablesText = 'None';


        const consumablesEnabled =
            document.getElementById(
                'consumablesToggle'
            ).checked;


        if (consumablesEnabled) {

            const ink =
                document.getElementById(
                    'inkQty'
                ).value || 0;


            const makeup =
                document.getElementById(
                    'makeupQty'
                ).value || 0;


            const wash =
                document.getElementById(
                    'washQty'
                ).value || 0;


            consumablesText =
                `Ink: ${ink} Nos, Makeup: ${makeup} Nos, Wash: ${wash} Nos`;

        }


        /*
         * Payload
         */

        const payload = {

            visitDate:
                document.getElementById(
                    'visitDate'
                ).value,

            engineerName:
                document.getElementById(
                    'engineerName'
                ).value.trim(),

            region:
                document.getElementById(
                    'region'
                ).value,

            customerName:
                document.getElementById(
                    'customerName'
                ).value.trim(),

            address:
                document.getElementById(
                    'address'
                ).value.trim(),

            printerBrand:
                document.getElementById(
                    'printerBrand'
                ).value.trim(),

            serialNumber:
                document.getElementById(
                    'serialNumber'
                ).value.trim(),

            warrantyStatus:
                document.getElementById(
                    'warrantyStatus'
                ).value,

            serviceType:
                document.getElementById(
                    'serviceType'
                ).value,

            serviceStatus:
                document.getElementById(
                    'serviceStatus'
                ).value,

            workDone:
                document.getElementById(
                    'workDone'
                ).value.trim(),

            partsReplaced:
                document.getElementById(
                    'partsReplaced'
                ).value.trim() || 'None',

            consumables:
                consumablesText,

            followUpDate:
                document.getElementById(
                    'followUpDate'
                ).value || 'N/A',

            signerName:
                document.getElementById(
                    'signerName'
                ).value.trim()

        };


        /*
         * WhatsApp message
         */

        let message = '';


        message +=
            `🛠️ *${CONFIG.companyName.toUpperCase()}* 🛠️\n`;

        message +=
            `📋 *SERVICE VISIT REPORT*\n\n`;


        message +=
            `📅 *Date:* ${payload.visitDate}\n`;

        message +=
            `👨‍🔧 *Engineer:* ${payload.engineerName}\n`;

        message +=
            `📍 *Region:* ${payload.region}\n\n`;


        message +=
            `🏢 *Customer:* ${payload.customerName}\n`;

        message +=
            `📌 *Address:* ${payload.address}\n\n`;


        message +=
            `🖨️ *Printer:* ${payload.printerBrand} (${payload.serialNumber})\n`;

        message +=
            `🛡️ *Warranty:* ${payload.warrantyStatus}\n\n`;


        message +=
            `⚙️ *Type:* ${payload.serviceType}\n`;


        message +=
            `📝 *Work Done:*\n${payload.workDone}\n\n`;


        message +=
            `🔧 *Parts Replaced:* ${payload.partsReplaced}\n`;


        message +=
            `🧪 *Consumables Requirement:* ${payload.consumables}\n`;


        message +=
            `📆 *Next Follow-up:* ${payload.followUpDate}\n`;


        message +=
            `📊 *Status:* ${payload.serviceStatus}\n\n`;


        message +=
            `✍️ *Signatory:* ${payload.signerName}\n\n`;


        message +=
            `_Generated by ${CONFIG.appName}_`;


        return message;

    }


    /*
     * ==========================================================
     * SEND TO WHATSAPP
     * ==========================================================
     */

    function sendToWhatsApp() {

        const message =
            createReportMessage();


        if (!message) {
            return;
        }


        const phone =
            String(
                CONFIG.whatsappNumber || ''
            ).replace(/\D/g, '');


        if (!phone) {

            showStatus(
                'WhatsApp number is not configured.',
                'error'
            );

            return;

        }


        const whatsappUrl =
            `https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(message)}`;


        /*
         * Open WhatsApp
         */

        window.open(
            whatsappUrl,
            '_blank'
        );

    }


    /*
     * ==========================================================
     * COPY MESSAGE
     * ==========================================================
     */

    async function copyMessage() {

        const message =
            createReportMessage();


        if (!message) {
            return;
        }


        try {

            await navigator.clipboard.writeText(
                message
            );


            const button =
                document.getElementById(
                    'copyBtn'
                );


            const buttonText =
                document.getElementById(
                    'copyBtnText'
                );


            button.classList.add(
                'copy-success'
            );


            buttonText.innerText =
                'Message Copied ✓';


            showStatus(
                'Service report message copied successfully.',
                'success'
            );


            setTimeout(
                function () {

                    buttonText.innerText =
                        'Copy Message';

                    button.classList.remove(
                        'copy-success'
                    );

                },
                2000
            );


        } catch (error) {

            /*
             * Fallback for older browsers
             */

            const textarea =
                document.createElement(
                    'textarea'
                );


            textarea.value = message;

            textarea.style.position =
                'fixed';

            textarea.style.opacity =
                '0';


            document.body.appendChild(
                textarea
            );


            textarea.select();


            try {

                document.execCommand(
                    'copy'
                );


                showStatus(
                    'Service report message copied successfully.',
                    'success'
                );


            } catch (copyError) {

                showStatus(
                    'Copy failed. Please select and copy the message manually.',
                    'error'
                );

            }


            document.body.removeChild(
                textarea
            );

        }

    }


    /*
     * ==========================================================
     * STATUS MESSAGE
     * ==========================================================
     */

    function showStatus(message, type) {

        const box =
            document.getElementById(
                'statusMessage'
            );


        box.classList.remove(
            'hidden'
        );


        box.innerText =
            message;


        if (type === 'success') {

            box.className =
                'text-center text-sm font-semibold rounded-xl p-3 bg-emerald-50 text-emerald-700 border border-emerald-200';

        } else {

            box.className =
                'text-center text-sm font-semibold rounded-xl p-3 bg-red-50 text-red-700 border border-red-200';

        }


        setTimeout(
            function () {

                box.classList.add(
                    'hidden'
                );

            },
            3000
        );

    }

</script>
