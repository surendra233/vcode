<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vcode Inkjet Solutions - Service Visit Report</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="https://drive.google.com/uc?export=view&id=1Bh0sQ7LYGPl_IwsisMQtHz3H45vYcefx">
    <style>canvas { touch-action: none; }</style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
        
        <!-- Header with Google Drive Logo Integration -->
        <div class="bg-slate-900 px-6 py-6 text-center border-b-4 border-red-600 relative">
            <div class="flex flex-col items-center justify-center space-y-2">
                <div class="bg-white px-4 py-2 rounded-xl shadow-md inline-flex items-center justify-center">
                    <img src="https://drive.google.com/uc?export=view&id=1Bh0sQ7LYGPl_IwsisMQtHz3H45vYcefx" alt="Vcode Logo" class="h-14 sm:h-16 object-contain">
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-wide">SERVICE VISIT REPORT</h1>
                    <p id="headerSubtitle" class="text-xs sm:text-sm text-red-400 font-medium tracking-wider uppercase mt-0.5">Vcode Inkjet Solutions Pvt Ltd</p>
                </div>
            </div>
        </div>

        <!-- Form Body -->
        <form id="serviceReportForm" class="p-6 sm:p-8 space-y-6">

            <!-- Visit & Engineer Info -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Visit Date</label>
                    <input type="date" id="visitDate" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Engineer Name</label>
                    <input type="text" id="engineerName" placeholder="Enter your name" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Region</label>
                    <select id="region" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                        <option value="">Select Region</option>
                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                        <option value="Telangana">Telangana</option>
                        <option value="Karnataka">Karnataka</option>
                        <option value="Orissa">Orissa</option>
                        <option value="Tamil Nadu">Tamil Nadu</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Customer Details -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Customer Name / Company</label>
                    <input type="text" id="customerName" placeholder="e.g. Sri Venkateswara Industries" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Customer Address / Location</label>
                    <input type="text" id="address" placeholder="e.g. Industrial Estate, Vijayawada" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
            </div>

            <!-- Machine Specs -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 pt-2">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Printer Brand / Model</label>
                    <input type="text" id="printerBrand" placeholder="e.g. Vcode CIJ" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Serial Number</label>
                    <input type="text" id="serialNumber" placeholder="e.g. VC-2026-908" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Warranty Status</label>
                    <select id="warrantyStatus" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                        <option value="">Select Status</option>
                        <option value="Under Warranty">Under Warranty</option>
                        <option value="Out of Warranty">Out of Warranty</option>
                        <option value="AMC Contract">AMC Contract</option>
                    </select>
                </div>
            </div>

            <!-- Service Specifics -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Service Type</label>
                    <select id="serviceType" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                        <option value="">Select Type</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Repair">Repair</option>
                        <option value="Breakdown">Breakdown</option>
                        <option value="General Visit">General Visit</option>
                        <option value="Installation">Installation</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Service Status</label>
                    <select id="serviceStatus" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white font-semibold">
                        <option value="🟢 Completed">🟢 Completed</option>
                        <option value="🟡 Pending">🟡 Pending</option>
                    </select>
                </div>
            </div>

            <!-- Remarks & Parts -->
            <div class="space-y-4 pt-2">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Work Done / Observations</label>
                    <textarea id="workDone" rows="3" placeholder="Describe issue found & corrective action..." required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Parts Replaced (Optional)</label>
                        <input type="text" id="partsReplaced" placeholder="e.g. Filter, Nozzle" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Next Follow-up Date (Optional)</label>
                        <input type="date" id="followUpDate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
                    </div>
                </div>
            </div>

            <!-- Consumables Stock Requirement Section (Optional with Quantities) -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-bold text-slate-700 uppercase">Consumables Stock Requirement (Optional)</label>
                    <input type="checkbox" id="consumablesToggle" onchange="toggleConsumablesBox()" class="w-4 h-4 text-red-600 rounded focus:ring-red-500">
                </div>
                
                <div id="consumablesFields" class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 hidden">
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Makeup Quantity (Nos)</label>
                        <input type="number" id="makeupQty" value="3" min="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-slate-600 uppercase mb-1">Wash Quantity (Nos)</label>
                        <input type="number" id="washQty" value="3" min="0" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white">
                    </div>
                </div>
            </div>

            <!-- Dual Signatures -->
            <div class="pt-4 border-t border-slate-200 grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-700 uppercase">Engineer Signature</label>
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] text-slate-500">Sign below</span>
                        <button type="button" onclick="clearPad('engineer')" class="text-xs text-red-600 underline">Clear</button>
                    </div>
                    <div class="border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 overflow-hidden">
                        <canvas id="engineerCanvas" width="300" height="120" class="w-full cursor-crosshair bg-white"></canvas>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-bold text-slate-700 uppercase">Customer Signatory Name & Signature</label>
                    <input type="text" id="signerName" placeholder="Signer Name" required class="w-full px-2 py-1.5 border border-slate-300 rounded-lg text-xs mb-1">
                    <div class="flex justify-between items-center">
                        <span class="text-[11px] text-slate-500">Sign below</span>
                        <button type="button" onclick="clearPad('customer')" class="text-xs text-red-600 underline">Clear</button>
                    </div>
                    <div class="border-2 border-dashed border-slate-300 rounded-xl bg-slate-50 overflow-hidden">
                        <canvas id="customerCanvas" width="300" height="120" class="w-full cursor-crosshair bg-white"></canvas>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="pt-4 flex flex-col sm:flex-row gap-3">
                <button type="button" onclick="submitAndSendWhatsApp()" 
                        class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl shadow-lg flex items-center justify-center space-x-2">
                    <i class="fab fa-whatsapp text-xl"></i>
                    <span id="whatsappBtnText">Save & Send to WhatsApp</span>
                </button>
            </div>

        </form>
    </div>

    <!-- Script Control Panel -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwSyVa_a-NvOdZAiFknXUEMk2v5Y7ca4Ke0czJrEzWBha56j3-_Tm-BMV1Rboo5MZfY4g/exec";

        let CONFIG = {
            companyName: "Vcode Inkjet Solutions Pvt Ltd",
            whatsappNumber: "918985361991"
        };

        window.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('visitDate').value = new Date().toISOString().split('T')[0];
            
            if (SCRIPT_URL) {
                try {
                    let response = await fetch(SCRIPT_URL);
                    let remoteConfig = await response.json();
                    if(remoteConfig.company_name) CONFIG.companyName = remoteConfig.company_name;
                    if(remoteConfig.whatsapp_number) CONFIG.whatsappNumber = remoteConfig.whatsapp_number;
                } catch(e) { console.log("Using default configuration fallback"); }
            }

            document.getElementById('headerSubtitle').innerText = CONFIG.companyName;
            document.getElementById('whatsappBtnText').innerText = `Save & Send to WhatsApp (${CONFIG.whatsappNumber.slice(2)})`;

            initSignaturePad('engineerCanvas');
            initSignaturePad('customerCanvas');

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed'));
            }
        });

        function toggleConsumablesBox() {
            const isChecked = document.getElementById('consumablesToggle').checked;
            const box = document.getElementById('consumablesFields');
            if (isChecked) {
                box.classList.remove('hidden');
            } else {
                box.classList.add('hidden');
            }
        }

        const padStates = {
            engineerCanvas: { isDrawing: false, signed: false, ctx: null },
            customerCanvas: { isDrawing: false, signed: false, ctx: null }
        };

        function initSignaturePad(canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            padStates[canvasId].ctx = ctx;

            canvas.addEventListener('mousedown', (e) => startDraw(e, canvasId));
            canvas.addEventListener('mousemove', (e) => draw(e, canvasId));
            canvas.addEventListener('mouseup', () => stopDraw(canvasId));
            canvas.addEventListener('mouseleave', () => stopDraw(canvasId));
            canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e.touches[0], canvasId); });
            canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0], canvasId); });
            canvas.addEventListener('touchend', (e) => { e.preventDefault(); stopDraw(canvasId); });
        }

        function getPos(e, canvas) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDraw(e, canvasId) {
            padStates[canvasId].isDrawing = true;
            padStates[canvasId].signed = true;
            const canvas = document.getElementById(canvasId);
            const pos = getPos(e, canvas);
            padStates[canvasId].ctx.beginPath();
            padStates[canvasId].ctx.moveTo(pos.x, pos.y);
        }

        function draw(e, canvasId) {
            if (!padStates[canvasId].isDrawing) return;
            const canvas = document.getElementById(canvasId);
            const pos = getPos(e, canvas);
            padStates[canvasId].ctx.lineTo(pos.x, pos.y);
            padStates[canvasId].ctx.stroke();
        }

        function stopDraw(canvasId) { padStates[canvasId].isDrawing = false; }

        function clearPad(type) {
            const canvasId = type === 'engineer' ? 'engineerCanvas' : 'customerCanvas';
            const canvas = document.getElementById(canvasId);
            padStates[canvasId].ctx.clearRect(0, 0, canvas.width, canvas.height);
            padStates[canvasId].signed = false;
        }

        async function submitAndSendWhatsApp() {
            const form = document.getElementById('serviceReportForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            let consumablesText = 'None';
            const consumablesEnabled = document.getElementById('consumablesToggle').checked;
            if (consumablesEnabled) {
                const makeup = document.getElementById('makeupQty').value || 0;
                const wash = document.getElementById('washQty').value || 0;
                consumablesText = `Makeup: ${makeup} Nos, Wash: ${wash} Nos`;
            }

            const payload = {
                action: "saveReport",
                visitDate: document.getElementById('visitDate').value,
                engineerName: document.getElementById('engineerName').value,
                region: document.getElementById('region').value,
                customerName: document.getElementById('customerName').value,
                address: document.getElementById('address').value,
                printerBrand: document.getElementById('printerBrand').value,
                serialNumber: document.getElementById('serialNumber').value,
                warrantyStatus: document.getElementById('warrantyStatus').value,
                serviceType: document.getElementById('serviceType').value,
                serviceStatus: document.getElementById('serviceStatus').value,
                workDone: document.getElementById('workDone').value,
                partsReplaced: document.getElementById('partsReplaced').value || 'None',
                consumables: consumablesText,
                followUpDate: document.getElementById('followUpDate').value || 'N/A',
                signerName: document.getElementById('signerName').value
            };

            if (SCRIPT_URL) {
                fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) }).catch(err => console.log(err));
            }

            let text = `🛠️ *${CONFIG.companyName.toUpperCase()}* 🛠️\n`;
            text += `📋 *SERVICE VISIT REPORT*\n\n`;
            text += `📅 *Date:* ${payload.visitDate}\n`;
            text += `👨‍🔧 *Engineer:* ${payload.engineerName}\n`;
            text += `📍 *Region:* ${payload.region}\n\n`;
            text += `🏢 *Customer:* ${payload.customerName}\n`;
            text += `📌 *Address:* ${payload.address}\n\n`;
            text += `🖨️ *Printer:* ${payload.printerBrand} (${payload.serialNumber})\n`;
            text += `🛡️ *Warranty:* ${payload.warrantyStatus}\n\n`;
            text += `⚙️ *Type:* ${payload.serviceType}\n`;
            text += `📝 *Work Done:*\n${payload.workDone}\n\n`;
            text += `🔧 *Parts Replaced:* ${payload.partsReplaced}\n`;
            text += `🧪 *Consumables Requirement:* ${payload.consumables}\n`;
            text += `📊 *Status:* ${payload.serviceStatus}\n\n`;
            text += `✍️ *Signatory:* ${payload.signerName}\n`;
            text += `_Saved to Database & Shared via Vcode App_`;

            const whatsappUrl = `https://api.whatsapp.com/send?phone=${CONFIG.whatsappNumber}&text=${encodeURIComponent(text)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
